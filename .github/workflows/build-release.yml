name: Build Windows x64 release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-release.yml"
      - "source/**"

permissions:
  contents: write

concurrency:
  group: windows-x64-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: source/requirements.txt

      - name: Install dependencies
        working-directory: source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller==6.8.0"

      - name: Build app.exe
        working-directory: source
        run: python -m PyInstaller app.spec --noconfirm

      - name: Checksum
        shell: pwsh
        run: |
          $exe = "source/dist/app.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  app.exe" | Set-Content "source/dist/app.exe.sha256" -Encoding ascii
          Get-Content "source/dist/app.exe.sha256"
          Get-Item $exe | Select-Object Name, Length, LastWriteTime

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: light-windows-x64
          path: |
            source/dist/app.exe
            source/dist/app.exe.sha256
          retention-days: 7

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload windows-x64 source/dist/app.exe source/dist/app.exe.sha256 --clobber
